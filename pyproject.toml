[project]
name = "self-healing-storefront-agent"
version = "0.1.0"
description = "An observability-first agent that turns Dynatrace signals into safe WordPress/WooCommerce actions, built with Gemini 3 and Google Cloud Agent Builder (ADK)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "google-adk>=1.0.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
telemetry = [
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]
deploy = [
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["storefront_agent"]
